version: '3.8'

networks:
  traefik-public:
    external: false

services:
  traefik:
    image: traefik:v2.9
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.file.filename=/etc/traefik/dynamic.yml
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --api.dashboard=true
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web
      - --certificatesresolvers.le.acme.email=${TRAEFIK_ACME_EMAIL}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
      - traefik_letsencrypt:/letsencrypt
    networks:
      - traefik-public

  db:
    image: postgres:13
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: social_media_manager
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - traefik-public

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - traefik-public

  server:
    build: ./server
    env_file: ./server/.env
    environment:
      DATABASE_URL: postgres://user:password@db:5432/social_media_manager
      REDIS_URL: redis://redis:6379
      PORT: 4000
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.server.rule=Host(`api.${DOMAIN}`)"
      - "traefik.http.routers.server.entrypoints=websecure"
      - "traefik.http.routers.server.tls.certresolver=le"
      - "traefik.http.services.server.loadbalancer.server.port=4000"
    depends_on:
      - db
      - redis
    networks:
      - traefik-public

  worker:
    build: ./server
    command: node worker.js
    env_file: ./server/.env
    environment:
      DATABASE_URL: postgres://user:password@db:5432/social_media_manager
      REDIS_URL: redis://redis:6379
    depends_on:
      - db
      - redis
    networks:
      - traefik-public

  client:
    build: ./client
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.client.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.client.entrypoints=websecure"
      - "traefik.http.routers.client.tls.certresolver=le"
      - "traefik.http.services.client.loadbalancer.server.port=80"
    depends_on:
      - server
    networks:
      - traefik-public

volumes:
  db_data:
  traefik_letsencrypt:
